<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>Casa de Iansa</title>

<style>
:root {
  --bg: #f4f5f7;
  --card: #fff;
  --dk: #1a1a2e;
  --dk2: #16213e;
  --dk3: #0f3460;
  --gold: #f0c040;
  --gold2: #e6a817;
  --red: #e74c3c;
  --blue: #3498db;
  --green: #2ecc71;
  --orange: #f39c12;
  --purple: #9b59b6;
  --wpp: #25d366;
  --gray: #888;
  --lg: #f0f0f0;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: 80px;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; }
input, textarea, select { font-family: inherit; }

/* Cabeçalho */
.hdr {
  background: linear-gradient(135deg, var(--dk), var(--dk2), var(--dk3));
  color: #fff;
  padding: 18px 16px 14px;
  border-radius: 0 0 24px 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}
.hdr-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.hdr-row img {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #fff;
  padding: 2px;
  object-fit: contain;
}
.hdr-nm { font-size: 11px; letter-spacing: 1px; opacity: .85; font-family: Georgia, serif; line-height: 1.2; }
.hdr-t {
  font-size: 22px; font-weight: 800;
  font-family: Georgia, serif;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hdr-i { margin-top: 3px; opacity: .7; font-size: 12px; }

/* Barra inferior de navegação */
.tbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: linear-gradient(135deg, var(--dk), var(--dk2));
  display: flex; justify-content: space-around;
  padding: 4px 0 max(6px, env(safe-area-inset-bottom));
  border-top: 1px solid rgba(255,255,255,.1);
  z-index: 100;
  box-shadow: 0 -4px 20px rgba(0,0,0,.3);
}
.tb {
  background: none;
  color: rgba(255,255,255,.5);
  display: flex; flex-direction: column; align-items: center;
  gap: 1px;
  font-size: 9px;
  padding: 3px 6px;
  transition: .2s;
}
.tb.on { color: var(--gold); font-weight: 700; transform: scale(1.05); }
.tb .ic { font-size: 18px; }

/* Cards e botões */
.cd {
  background: var(--card);
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  margin-bottom: 10px;
}
.bt {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  transition: .2s;
  margin-bottom: 8px;
}
.bt:disabled { background: #ccc !important; }
.bt .bi { font-size: 18px; }
.bt-sm { padding: 8px 14px; font-size: 13px; width: auto; display: inline-flex; margin: 0; }

/* Bolinhas de grupo (A, B, C, D) */
.gb {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  color: #fff;
  font-size: 11px; font-weight: 800;
  flex-shrink: 0;
}
.gA { background: var(--red); }
.gB { background: var(--blue); }
.gC { background: var(--green); }
.gD { background: var(--orange); }

/* Inputs */
.ig { margin-bottom: 12px; }
.ig label { font-size: 11px; font-weight: 700; color: #666; display: block; margin-bottom: 3px; }
.ig input, .ig textarea, .ig select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  transition: .2s;
}
.ig input:focus, .ig textarea:focus, .ig select:focus { border-color: var(--dk3); }

/* Modal */
.mo {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.mo.vis { display: flex; }
.mc {
  background: #fff;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  overflow: auto;
  padding: 16px 14px max(14px, env(safe-area-inset-bottom));
  animation: su .3s ease;
}
.mh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.mh h2 { font-size: 18px; font-weight: 800; color: var(--dk); }
.mx {
  background: var(--lg);
  border-radius: 50%;
  width: 34px; height: 34px;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}

/* Chips de filtro */
.ch {
  padding: 6px 14px;
  border-radius: 18px;
  background: var(--lg);
  color: #666;
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
}
.ch.on { background: var(--dk); color: #fff; }

/* Cabeçalho de fase (PRÉ, DURANTE, PÓS) */
.fh {
  padding: 8px 12px;
  border-radius: 10px;
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  margin-top: 4px;
  margin-bottom: 6px;
}

/* Botão de status de presença */
.sb {
  width: 34px; height: 34px;
  border-radius: 8px;
  font-size: 15px;
  background: var(--lg);
  transition: .15s;
}

/* Barra de progresso */
.pg { height: 4px; border-radius: 2px; background: var(--lg); overflow: hidden; margin-top: 4px; }
.pf { height: 100%; border-radius: 2px; transition: width .5s; }

/* Páginas */
.page { display: none; }
.page.on { display: block; }
.ct { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* Grids */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

/* Utilitários de flex */
.fx { display: flex; }
.fc { flex-direction: column; }
.ac { align-items: center; }
.jb { justify-content: space-between; }
.fw { flex-wrap: wrap; }
.gp4 { gap: 4px; }
.gp6 { gap: 6px; }
.gp8 { gap: 8px; }

/* Caixinhas decorativas */
.ng {
  background: linear-gradient(135deg, #fff9e6, #fff3cc);
  border: 1px solid var(--gold);
  border-radius: 14px;
  padding: 14px;
}
.ng .nt { font-size: 13px; font-weight: 700; color: #8a6d00; }
.ng .nd { font-size: 12px; color: #8a6d00; margin-top: 3px; }

.wp {
  background: var(--lg);
  padding: 10px;
  border-radius: 10px;
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 250px;
  overflow: auto;
  line-height: 1.4;
  font-family: monospace;
}

.mc2 {
  padding: 5px 10px;
  border-radius: 18px;
  border: 1px solid #ddd;
  background: #f8f8f8;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.aviso-card {
  background: linear-gradient(135deg, #fff9e6, #fffde8);
  border-left: 4px solid var(--gold);
  border-radius: 0 12px 12px 0;
  padding: 12px 14px;
  margin-bottom: 8px;
}

.cal-item {
  padding: 10px 12px;
  border-left: 4px solid var(--blue);
  border-radius: 0 10px 10px 0;
  background: #f8faff;
  margin-bottom: 6px;
}

.chk-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0f0;
}
.chk-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--green); }

.fix-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  background: #e8f5e9;
  color: #2e7d32;
}

/* Tela de login */
.login-bg {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--dk), var(--dk2), var(--dk3));
  padding: 20px;
}

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--gray); }
.loading .spin {
  display: inline-block;
  width: 30px; height: 30px;
  border: 3px solid var(--lg);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: sp .8s linear infinite;
}

@keyframes su { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>

<script>
// ============================================
// CONFIGURAÇÃO DO FIREBASE
// ============================================
firebase.initializeApp({
  apiKey: "AIzaSyACOP0FUNgs7PD3xaYA7QQhnUqnhtr8u00",
  authDomain: "casadeiansa-4497a.firebaseapp.com",
  projectId: "casadeiansa-4497a",
  storageBucket: "casadeiansa-4497a.firebasestorage.app",
  messagingSenderId: "861721911332",
  appId: "1:861721911332:web:5fb8880de37142154278b1"
});

var db = firebase.firestore();
var DOC_REF = db.collection("app").doc("data");


// ============================================
// CONSTANTES
// ============================================
var LOGO = "logo.png";
var PASS_PADRAO = "iansa2026";

// Grupos da casa
var GR = ["A", "B", "C", "D"];
var GC = {
  A: "#e74c3c",
  B: "#3498db",
  C: "#2ecc71",
  D: "#f39c12"
};

// Status de presença
var SM = {
  presente: { i: "✅", l: "Presente", c: "#2ecc71" },
  faltou:   { i: "❌", l: "Faltou",   c: "#e74c3c" },
  avisou:   { i: "🔔", l: "Avisou",   c: "#f39c12" },
  trocou:   { i: "🔄", l: "Trocou",   c: "#3498db" }
};

// Fases da escala
var FASES_PADRAO = ["PRÉ", "DURANTE", "PÓS"];
var FCOR = {
  "PRÉ":              "var(--orange)",
  "DURANTE":          "var(--blue)",
  "PÓS":              "var(--green)",
  "PRÉ-GIRA":         "var(--orange)",
  "DURANTE A GIRA":   "var(--blue)",
  "PÓS-GIRA":         "var(--green)"
};


// ============================================
// ESTADO DA APLICAÇÃO
// ============================================
var D = {
  membros: [],
  giras: [],
  tarefas: [],
  tiposEscala: ["Gira"],
  rot: 0,
  nMid: 1,
  nGid: 1,
  mensalidades: {},
  itensDoacao: [],
  sorteios: {},
  calendario: [],
  avisos: [],
  inscricaoAtiva: false,
  inscricaoLabel: "",
  inscricoes: []
};

var mode = "";       // "admin" ou "filho"
var cTab = "home";
var fM = "todos";    // filtro de membros
var fTipo = "Gira";  // filtro de tipo na aba tarefas

// Estado da criação de escala
var eS = {
  etapa: "inicio",   // inicio | filhos | selecionar | preview
  gira: null,
  esc: null,
  sel: null,         // tarefas selecionadas
  selFilhos: [],     // IDs dos filhos que vão participar
  fasesFilhos: {},   // { filhoId: "PRÉ" | "PÓS" | "AMBOS" }
  tipo: "Gira",
  voluntariado: false
};

var pGid = null;
var dataLoaded = false;


// ============================================
// FIRESTORE — CARREGAR E SALVAR
// ============================================
function loadFromFirebase(cb) {
  DOC_REF.get().then(function (doc) {
    if (doc.exists) {
      D = doc.data();

      // Garantir que todos os campos existam
      if (!D.membros)      D.membros = [];
      if (!D.giras)        D.giras = [];
      if (!D.tarefas || !D.tarefas.length) D.tarefas = defaultTarefas();
      if (!D.mensalidades) D.mensalidades = {};
      if (!D.valorMensalidade) D.valorMensalidade = 0;
      if (!D.tiposEscala || !D.tiposEscala.length) D.tiposEscala = ["Gira"];
      if (!D.senhaAdmin)   D.senhaAdmin = PASS_PADRAO;
      if (!D.itensDoacao)  D.itensDoacao = [];
      if (!D.sorteios)     D.sorteios = {};
      if (!D.calendario)   D.calendario = [];
      if (!D.avisos)       D.avisos = [];
      if (!D.rot)          D.rot = 0;
      if (!D.nMid)         D.nMid = 1;
      if (!D.nGid)         D.nGid = 1;

      // Migrar nomes antigos das fases
      D.tarefas.forEach(function (t) {
        if (!t.fixos) t.fixos = [];
        if (!t.tipo)  t.tipo = "Gira";
        if (t.fase === "PRÉ-GIRA")        t.fase = "PRÉ";
        if (t.fase === "DURANTE A GIRA")  t.fase = "DURANTE";
        if (t.fase === "PÓS-GIRA")        t.fase = "PÓS";
      });

    } else {
      D.tarefas = defaultTarefas();
      sv();
    }

    dataLoaded = true;
    if (cb) cb();

  }).catch(function (err) {
    console.error("Firebase load error:", err);
    D.tarefas = defaultTarefas();
    dataLoaded = true;
    if (cb) cb();
  });
}

function sv() {
  DOC_REF.set(JSON.parse(JSON.stringify(D))).catch(function (err) {
    console.error("Firebase save error:", err);
  });
}


// ============================================
// TAREFAS PADRÃO (primeira vez que abre o app)
// ============================================
function defaultTarefas() {
  return [
    // PRÉ-GIRA
    { tipo: "Gira", fase: "PRÉ", nome: "Filho de Trabalho Responsável", qtd: 1, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Varrer e passar pano no terreiro + cuspidores", qtd: 4, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Varrer calçada e guardar vassouras/rodos/bacias", qtd: 1, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Varrer, passar pano e organizar o 2º andar", qtd: 3, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Limpar as cadeiras", qtd: 2, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Organizar a cozinha", qtd: 2, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Lavar os 3 banheiros e repor utensílios", qtd: 3, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Lavar panos de chão e estender", qtd: 1, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Estoque", qtd: 1, fixos: [] },
    { tipo: "Gira", fase: "PRÉ", nome: "Cuidar da casinha de Exu", qtd: 1, fixos: [] },

    // DURANTE
    { tipo: "Gira", fase: "DURANTE", nome: "Caixa", qtd: 1, fixos: [] },
    { tipo: "Gira", fase: "DURANTE", nome: "Cantina", qtd: 2, fixos: [] },
    { tipo: "Gira", fase: "DURANTE", nome: "Chamar a assistência", qtd: 3, fixos: [] },

    // PÓS-GIRA
    { tipo: "Gira", fase: "PÓS", nome: "Responsável Pós-Gira", qtd: 1, fixos: [] },
    { tipo: "Gira", fase: "PÓS", nome: "Arrumar a cozinha", qtd: 2, fixos: [] },
    { tipo: "Gira", fase: "PÓS", nome: "Lavar os 2 banheiros", qtd: 2, fixos: [] },
    { tipo: "Gira", fase: "PÓS", nome: "Varrer e passar pano + guardar cuspidores/copos de vela", qtd: 4, fixos: [] },
    { tipo: "Gira", fase: "PÓS", nome: "Tirar lixo, guardar vassouras, lavar panos", qtd: 1, fixos: [] },
    { tipo: "Gira", fase: "PÓS", nome: "Organizar 2º andar (verificar pertences)", qtd: 1, fixos: [] }
  ];
}


// ============================================
// HELPERS
// ============================================
function atv() {
  return D.membros.filter(function (m) { return m.ativo; });
}

function gp() {
  return D.giras.filter(function (g) { return g.status === "publicada"; });
}

function shuf(a) {
  a = [].concat(a);
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

function esc(s) {
  return s
    ? String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    : "";
}

function gb(g) {
  return '<span class="gb g' + g + '">' + g + '</span>';
}

function isA() { return mode === "admin"; }

function mesAno() {
  var d = new Date();
  return (d.getMonth() + 1) + "/" + d.getFullYear();
}


// ============================================
// LOGIN
// ============================================
document.getElementById("login-logo").src = LOGO;

document.getElementById("btn-ef").addEventListener("click", function () {
  mode = "filho";
  startApp();
});

document.getElementById("btn-ea").addEventListener("click", function () {
  document.getElementById("ls").style.display = "block";
  var saved = localStorage.getItem("terreiro_saved_pass");
  if (saved) {
    document.getElementById("inp-s").value = saved;
    document.getElementById("chk-lembrar").checked = true;
  }
});

document.getElementById("btn-lg").addEventListener("click", doLogin);

document.getElementById("inp-s").addEventListener("keydown", function (ev) {
  if (ev.key === "Enter") doLogin();
});

function doLogin() {
  var senhaDigitada = document.getElementById("inp-s").value;
  var lembrar = document.getElementById("chk-lembrar").checked;

  DOC_REF.get().then(function (doc) {
    var senhaCorreta = PASS_PADRAO;
    if (doc.exists && doc.data().senhaAdmin) {
      senhaCorreta = doc.data().senhaAdmin;
    }

    if (senhaDigitada === senhaCorreta) {
      if (lembrar) {
        localStorage.setItem("terreiro_saved_pass", senhaDigitada);
      } else {
        localStorage.removeItem("terreiro_saved_pass");
      }
      mode = "admin";
      startApp();
    } else {
      mostrarErroLogin();
    }
  }).catch(function () {
    // Fallback: se não conectar no Firebase, aceita a senha padrão
    if (senhaDigitada === PASS_PADRAO) {
      if (lembrar) {
        localStorage.setItem("terreiro_saved_pass", senhaDigitada);
      } else {
        localStorage.removeItem("terreiro_saved_pass");
      }
      mode = "admin";
      startApp();
    } else {
      mostrarErroLogin();
    }
  });
}

function mostrarErroLogin() {

  document.getElementById("login-screen").style.display = "none";

  if (tab === "escala") {
    eS = { etapa: "inicio", gira: null, esc: null, sel: null, selFilhos: [], fasesFilhos: {}, tipo: "Gira", voluntariado: false };
  }
  if (tab === "presenca") pGid = null;

  document.querySelectorAll(".page").forEach(function (p) { p.classList.remove("on"); });
  var el = document.getElementById("p-" + tab);
  if (el) el.classList.add("on");

  document.querySelectorAll(".tb").forEach(function (b) {
    b.classList.toggle("on", b.getAttribute("data-tab") === tab);
  });

  // Para o modo filho, sempre recarrega do firebase
  if (!isA() && dataLoaded) {

  } else {

  }
}

// ============================================
// GERADOR DE ESCALA
// — Respeita a lista de filhos selecionados e a fase escolhida pra cada um
// — PRÉ: só entra em tarefas PRÉ
// — PÓS: só entra em tarefas PÓS
// — AMBOS: pode entrar em PRÉ ou PÓS
// — DURANTE: qualquer um selecionado (independente da fase) pode entrar
// ============================================
function gerarEsc(tarefasSel, filhosIds, fasesFilhos) {
  fasesFilhos = fasesFilhos || {};

  // Pega só os filhos que o admin marcou pra participar
  var poolMembros = D.membros.filter(function (m) {
    return m.ativo && filhosIds.indexOf(m.id) >= 0;
  });

  var rot = D.rot;
  var todosFixos = {};

  // Marca os fixos pra não entrarem no sorteio
  tarefasSel.forEach(function (t) {
    if (t.fixos) t.fixos.forEach(function (fid) { todosFixos[fid] = true; });
  });

  // Pools separados por fase
  // — disponíveis pra PRÉ: quem foi marcado como PRÉ ou AMBOS
  // — disponíveis pra PÓS: quem foi marcado como PÓS ou AMBOS
  // — disponíveis pra DURANTE: todos os selecionados
  var poolPre = shuf(poolMembros.filter(function (m) {
    if (todosFixos[m.id]) return false;
    var f = fasesFilhos[m.id];
    return f === "PRÉ" || f === "AMBOS";
  }));

  var poolPos = shuf(poolMembros.filter(function (m) {
    if (todosFixos[m.id]) return false;
    var f = fasesFilhos[m.id];
    return f === "PÓS" || f === "AMBOS";
  }));

  var poolDurante = shuf(poolMembros.filter(function (m) {
    return !todosFixos[m.id];
  }));

  // Contadores pra distribuir round-robin nos pools
  var iPre = 0;
  var iPos = 0;
  var iDur = 0;

  var res = [];

  tarefasSel.forEach(function (t) {
    var membros = [];

    // Adiciona fixos primeiro (eles entram independente da fase)
    if (t.fixos && t.fixos.length) {
      t.fixos.forEach(function (fid) {
        var m = D.membros.find(function (x) { return x.id === fid; });
        if (m) membros.push(JSON.parse(JSON.stringify(m)));
      });
    }

    var falta = t.qtd - membros.length;
    if (falta <= 0) {
      res.push({ fase: t.fase, tarefa: t.nome, qtd: t.qtd, membros: membros });
      return;
    }

    // Escolhe o pool certo conforme a fase da tarefa
    var pool, idx;
    if (t.fase === "PRÉ") {
      pool = poolPre;
      idx = iPre;
    } else if (t.fase === "PÓS") {
      pool = poolPos;
      idx = iPos;
    } else {
      // DURANTE — pega de qualquer um selecionado
      pool = poolDurante;
      idx = iDur;
    }

    // Distribui rotacionando no pool
    for (var i = 0; i < falta; i++) {
      if (pool && pool.length) {
        membros.push(JSON.parse(JSON.stringify(pool[idx % pool.length])));
        idx++;
      }
    }

    // Atualiza o contador certo
    if      (t.fase === "PRÉ") iPre = idx;
    else if (t.fase === "PÓS") iPos = idx;
    else                       iDur = idx;

    res.push({ fase: t.fase, tarefa: t.nome, qtd: t.qtd, membros: membros });
  });

  return res;
}

      var membrosGrupo = a.filter(function (m) { return m.grupo === g; });
      if (!membrosGrupo.length) return;

      var nSel = membrosGrupo.filter(function (m) { return eS.selFilhos.indexOf(m.id) >= 0; }).length;
      h += '<div class="fh" style="background:' + GC[g] + '">Grupo ' + g + ' (' + nSel + '/' + membrosGrupo.length + ')</div>';

      membrosGrupo.forEach(function (m) {
        var fase = eS.fasesFilhos[m.id]; // "PRÉ", "PÓS", "AMBOS" ou undefined
        var marcado = !!fase;

        // Cor da borda e do badge muda conforme a fase escolhida
        var corBorda = "#e8e8e8";
        var corFundo = "#fff";
        var badgeTxt = "";
        var badgeCor = "";

        if (fase === "PRÉ")   { corBorda = "var(--orange)"; corFundo = "#fff4e6"; badgeTxt = "PRÉ";   badgeCor = "var(--orange)"; }
        if (fase === "PÓS")   { corBorda = "var(--green)";  corFundo = "#e8f5e9"; badgeTxt = "PÓS";   badgeCor = "var(--green)"; }
        if (fase === "AMBOS") { corBorda = "var(--blue)";   corFundo = "#e3f2fd"; badgeTxt = "AMBOS"; badgeCor = "var(--blue)"; }

        // Card inteiro é o botão — qualquer toque abre o modal de fase
        h += '<button type="button" data-escolher-fase="' + m.id + '" ';
        h +=   'style="width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;';
        h +=   'border-radius:14px;border:2px solid ' + corBorda + ';';
        h +=   'background:' + corFundo + ';';
        h +=   'box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;';
        h +=   'display:flex;align-items:center;gap:10px;transition:.15s">';

        h +=   '<span style="font-size:22px;flex-shrink:0;pointer-events:none">' + (marcado ? "✅" : "⬜") + '</span>';
        h +=   '<span style="pointer-events:none">' + gb(m.grupo) + '</span>';

        h +=   '<span style="flex:1;min-width:0;pointer-events:none">';
        h +=     '<span style="display:block;font-weight:600;font-size:14px;color:var(--dk)">' + esc(m.nome) + '</span>';
        if (m.apelido) h += '<span style="display:block;font-size:11px;color:var(--gray)">@' + esc(m.apelido) + '</span>';
        h +=   '</span>';

        // Badge da fase escolhida (à direita)
        if (marcado) {
          h += '<span style="pointer-events:none;background:' + badgeCor + ';color:#fff;';
          h +=   'padding:4px 10px;border-radius:12px;font-size:11px;font-weight:800;flex-shrink:0">' + badgeTxt + '</span>';
        } else {
          h += '<span style="pointer-events:none;color:var(--gray);font-size:11px;flex-shrink:0">toque p/ escolher</span>';
        }

        h += '</button>';
      });
    });

    // Navegação
    h += '<div class="fx gp8">';
    h +=   '<button class="bt" id="btn-volt-inicio" style="background:var(--gray);flex:1"><span class="bi">←</span> Voltar</button>';
    h +=   '<button class="bt" id="btn-ir-tarefas" style="background:var(--blue);flex:1"' +
           (eS.selFilhos.length < 1 ? " disabled" : "") + '>' +
           '<span class="bi">→</span> Próximo: Tarefas</button>';
    h += '</div>';
    if (eS.selFilhos.length < 1) {
      h += '<p style="font-size:11px;color:var(--red);text-align:center">⚠️ Toque nos cards pra escolher PRÉ, PÓS ou AMBOS</p>';
    }
  }

  // ----- ETAPA 3: SELECIONAR TAREFAS -----
  if (isA() && eS.etapa === "selecionar") {
    h += '<div class="cd" style="background:#f0f4ff;border:2px solid var(--blue)">';
    h +=   '<div style="font-size:15px;font-weight:800;color:var(--blue)">☑️ Tarefas de ' + esc(eS.tipo) + '</div>';
    if (eS.voluntariado) {
      h += '<div style="font-size:11px;color:var(--green);margin-top:3px;font-weight:700">🔋 Voluntariado ativo — filhos escolhem PRÉ/PÓS. DURANTE será preenchido pelo admin.</div>';
    } else {
      h += '<div style="font-size:11px;color:var(--gray);margin-top:3px">Marque as que entram nesta escala</div>';
    }
    h +=   '<div style="font-size:11px;color:var(--purple);margin-top:6px">👥 ' + eS.selFilhos.length + ' filhos selecionados</div>';
    h += '</div>';

    var tarefasTipo = D.tarefas.filter(function (t) { return t.tipo === eS.tipo; });

    FASES_PADRAO.forEach(function (fase) {
      var ts = tarefasTipo.filter(function (t) { return t.fase === fase; });
      if (!ts.length) return;

      // Caso especial: voluntariado + DURANTE = só admin preenche
      if (eS.voluntariado && fase === "DURANTE") {
        h += '<div class="fh" style="background:' + (FCOR[fase] || "#888") + '">DURANTE ' +
             '<span style="font-size:10px;font-weight:400;opacity:.8">(preenchido pelo admin)</span></div>';
        ts.forEach(function (t) {
          var idx = D.tarefas.indexOf(t);
          var checked = eS.sel.indexOf(idx) >= 0;
          h += '<div class="chk-row" style="padding:6px 12px;background:#fff9f0;border-radius:10px;margin-bottom:4px;opacity:.6">';
          h +=   '<input type="checkbox" data-sel-tarefa="' + idx + '"' + (checked ? " checked" : "") + ' disabled>';
          h +=   '<div style="flex:1">';
          h +=     '<div style="font-size:13px;font-weight:600">' + esc(t.nome) + '</div>';
          h +=     '<div style="font-size:11px;color:var(--gray)">' + t.qtd + 'p — admin decide</div>';
          h +=   '</div>';
          h += '</div>';
        });
        return;
      }

      h += '<div class="fh" style="background:' + (FCOR[fase] || "#888") + '">' + fase + '</div>';
      ts.forEach(function (t) {
        var idx = D.tarefas.indexOf(t);
        var checked = eS.sel.indexOf(idx) >= 0;
        h += '<div class="chk-row" style="padding:6px 12px;background:var(--card);border-radius:10px;margin-bottom:4px">';
        h +=   '<input type="checkbox" data-sel-tarefa="' + idx + '"' + (checked ? " checked" : "") + '>';
        h +=   '<div style="flex:1">';
        h +=     '<div style="font-size:13px;font-weight:600">' + esc(t.nome) + '</div>';
        h +=     '<div style="font-size:11px;color:var(--gray)">' + t.qtd + 'p' +
                  (t.fixos && t.fixos.length ? " • " + t.fixos.length + " fixo" + (t.fixos.length > 1 ? "s" : "") : "") + '</div>';
        h +=   '</div>';
        h += '</div>';
      });
    });

    h += '<div class="fx gp8">';
    h +=   '<button class="bt" id="btn-volt-filhos" style="background:var(--gray);flex:1"><span class="bi">←</span> Voltar</button>';
    h +=   '<button class="bt" id="btn-gerar-esc" style="background:var(--green);flex:1"><span class="bi">⚡</span> Gerar</button>';
    h += '</div>';
    h += '<button class="bt" id="btn-canc-sel" style="background:var(--red)"><span class="bi">❌</span> Cancelar tudo</button>';
  }

  // ----- ETAPA 4: PREVIEW -----
  if (isA() && eS.etapa === "preview") {
    var es = eS.esc;
    var gi = eS.gira;
    var fa = "";

    h += '<div class="cd" style="background:#f8f9fa;border:2px solid var(--dk3)">';
    h +=   '<div style="font-size:15px;font-weight:800;color:var(--dk3)">👁 Preview — ' + esc(gi.data) + '</div>';
    h +=   '<div style="font-size:11px;color:var(--gray);margin-top:3px">Toque no nome para trocar</div>';
    h += '</div>';

    es.forEach(function (item, i) {
      if (item.fase !== fa) {
        fa = item.fase;
        h += '<div class="fh" style="background:' + (FCOR[fa] || "#888") + '">' + fa + '</div>';
      }
      h += '<div class="cd" style="padding:8px 12px">';
      h +=   '<div style="font-size:12px;font-weight:700;color:#444;margin-bottom:4px">' + esc(item.tarefa) + '</div>';
      h +=   '<div class="fx fw gp4">';
      item.membros.forEach(function (m, mi) {
        h += '<button class="mc2" data-troca="' + i + '-' + mi + '">' + gb(m.grupo) + ' ' +
             (m.apelido ? "@" + esc(m.apelido) : esc(m.nome)) + '</button>';
      });
      h +=   '</div>';
      h += '</div>';
    });

    h += '<div class="fx gp8">';
    h +=   '<button class="bt" id="btn-regen" style="background:var(--orange);flex:1"><span class="bi">🔄</span>Regerar</button>';
    h +=   '<button class="bt" id="btn-canc" style="background:var(--red);flex:1"><span class="bi">❌</span>Cancelar</button>';
    h += '</div>';
    h += '<button class="bt" id="btn-pub" style="background:var(--green)"><span class="bi">✅</span> Publicar</button>';
  }

  // ----- ESCALAS JÁ PUBLICADAS -----
  if (p.length) {
    h += '<h3 style="font-size:14px;font-weight:700;color:var(--dk);margin:4px 0">📅 Escalas publicadas</h3>';
    p.slice(-8).reverse().forEach(function (g) {
      var tot = g.escala.reduce(function (s, x) { return s + x.membros.length; }, 0);
      var tipo = g.tipo || "Gira";
      var temVol = g.voluntariado;

      h += '<div class="cd" style="padding:10px 12px"><div class="fx jb ac"><div>';
      h +=   '<div style="font-weight:700;font-size:14px">' + esc(tipo) + ' ' + esc(g.data) + '</div>';
      h +=   '<div style="font-size:11px;color:var(--gray)">' + tot + ' pessoas';
      if (temVol) h += ' • <span style="color:var(--green);font-weight:700">🔋 Voluntariado</span>';
      h +=   '</div></div><div class="fx gp4">';

      if (isA()) {
        if (temVol) h += '<button class="bt bt-sm" style="background:var(--green)" data-ver-vol="' + g.id + '">👥 Vol.</button>';
        h += '<button class="bt bt-sm" style="background:var(--wpp)" data-wpp="' + g.id + '">📱</button>';
        h += '<button class="bt bt-sm" style="background:var(--orange)" data-gopres="' + g.id + '">✅</button>';
        h += '<button class="bt bt-sm" style="background:var(--red)" data-delgira="' + g.id + '">🗑️</button>';
      } else {
        if (temVol) h += '<button class="bt bt-sm" style="background:var(--green)" data-inscr="' + g.id + '">✋ Me Inscrever</button>';
        h += '<button class="bt bt-sm" style="background:var(--blue)" data-ver-escala="' + g.id + '">👁 Ver</button>';
      }

      h += '</div></div></div>';
    });
  }

  h += '</div>';
  el.innerHTML = h;
  setLogos();
}

function wppMsg(gi) {

    "PRÉ-GIRA":        "🔸",

    "PÓS-GIRA":        "🔸",
    "PRÉ":             "🔸",

  };

  var m = "Boa tarde, filhos! Benção a todos! 🙏\n\n";
  m += "Segue a escala da *" + tipo + "* de *" + gi.data + "*:\n\n";
  m += "📌 *IMPORTANTE: Quem NÃO puder comparecer, avise.*\n";
  m += "⚠️ *Quem não responder, está CONFIRMADO.*\n";

  var fa = "";
  gi.escala.forEach(function (item) {
    if (item.fase !== fa) {

      m += "\n" + (em[fa] || "▪️") + " *" + fa + "*\n";

    m += "• " + item.tarefa + ": " + ns + "\n";
  });

  m += "\n💛 Se todos colaborarem, nossa casa fica linda!\nAxé! 🙏✨";
  return m;
}

    ms.forEach(function (m) {
      var st = (gi.presenca || {})[m.id];

      h +=   '<span style="font-weight:600;font-size:13px">' + (m.apelido ? "@" + esc(m.apelido) : esc(m.nome)) + '</span></div><div class="fx gp4">';
      Object.keys(SM).forEach(function (k) {

      });

    });

  h += '</div>';
  el.innerHTML = h;
  setLogos();
}


// ============================================
// PÁGINA RELATÓRIO
// ============================================
function rRelatorio() {
  var el = document.getElementById("p-relatorio");
  var p = gp();
  var a = atv();

  var h = mkHdr("Relatório", p.length + " giras");
  h += '<div class="ct">';

  a.map(function (m) {
    var pr = 0, fa = 0, av = 0, tot = 0;
    p.forEach(function (g) {
      if (g.escala.some(function (x) { return x.membros.some(function (mm) { return mm.id === m.id; }); })) {
        tot++;
        var s = (g.presenca || {})[m.id];
        if      (s === "presente") pr++;
        else if (s === "faltou")   fa++;
        else if (s === "avisou")   av++;
      }
    });
    return {
      nome: m.nome, grupo: m.grupo,
      pr: pr, fa: fa, av: av, tot: tot,
      pct: tot > 0 ? Math.round(pr / tot * 100) : null
    };
  }).sort(function (a, b) {
    return (a.pct === null ? -1 : a.pct) - (b.pct === null ? -1 : b.pct);
  }).forEach(function (m) {
    var c = m.pct >= 70 ? "var(--green)" : m.pct >= 40 ? "var(--orange)" : "var(--red)";

    h += '<div class="cd" style="padding:8px 12px"><div class="fx ac jb"><div class="fx ac gp6" style="flex:1;min-width:0">' + gb(m.grupo);
    h +=   '<div style="min-width:0">';
    h +=     '<div style="font-weight:700;font-size:13px;color:var(--dk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.nome) + '</div>';
    h +=     '<div style="font-size:10px;color:var(--gray)">✅' + m.pr + ' ❌' + m.fa + ' 🔔' + m.av + '</div>';
    h +=   '</div></div>';
    h +=   '<div style="text-align:right">' +
            (m.pct !== null ? '<div style="font-size:18px;font-weight:800;color:' + c + '">' + m.pct + '%</div>' : '<div style="color:#ccc">—</div>');
    if (m.fa >= 3) h += '<div style="font-size:9px;color:var(--red)">⚠️</div>';
    h +=   '</div></div>' +
            (m.tot > 0 ? '<div class="pg"><div class="pf" style="width:' + m.pct + '%;background:' + c + '"></div></div>' : "") +
          '</div>';
  });

  h += '</div>';
  el.innerHTML = h;
  setLogos();
}

  h += '<div class="cd" style="text-align:center"><div style="font-size:20px;font-weight:800;color:var(--green)">' +

  var atividadesFixas = [

    { t: "Desenvolvimento",     d: "Quarta quinzenal, 19h",    c: "var(--orange)" },
    { t: "Reza de Preto Velho", d: "1ª segunda, 19h",          c: "var(--purple)" },
    { t: "Grupo de Estudos",    d: "Quarta quinzenal, 19h",    c: "var(--blue)"   },
    { t: "Projeto Raízes",      d: "Última segunda, 19:30h",   c: "var(--green)"  }
  ];
  atividadesFixas.forEach(function (f) {
    h += '<div class="cal-item" style="border-left-color:' + f.c + '">' +
         '<div style="font-weight:700;font-size:13px">' + f.t + '</div>' +
         '<div style="font-size:12px;color:var(--gray)">' + f.d + '</div></div>';
  });

  if (D.calendario.length) {
    h += '<div style="font-size:14px;font-weight:700;color:var(--dk);margin:8px 0 4px">📅 Eventos</div>';
    D.calendario.forEach(function (ev, i) {
      h += '<div class="cal-item" style="border-left-color:var(--gold)"><div class="fx jb ac"><div>';
      h +=   '<div style="font-weight:700;font-size:13px">' + esc(ev.titulo) + '</div>';
      h +=   '<div style="font-size:12px;color:var(--gray)">' + esc(ev.data) + '</div></div>';
      if (isA()) h += '<button style="background:#fee;border-radius:6px;padding:4px 8px;font-size:12px" data-delcal="' + i + '">🗑️</button>';
      h += '</div></div>';
    });
  }

  h += '</div>';
  el.innerHTML = h;
  setLogos();
}


// ============================================
// PÁGINA AVISOS
// ============================================
function rAvisos() {
  var el = document.getElementById("p-avisos");

  var h = mkHdr("Avisos", "Recados");
  h += '<div class="ct">';

  if (isA()) {
    h += '<button class="bt" id="btn-add-aviso" style="background:var(--orange)"><span class="bi">📢</span> Novo</button>';
  }

  if (!D.avisos.length) h += '<div style="text-align:center;padding:30px;color:#aaa">Nenhum aviso.</div>';

  D.avisos.slice().reverse().forEach(function (av, i) {
    var ri = D.avisos.length - 1 - i;
    h += '<div class="aviso-card"><div class="fx jb">' +
         '<div style="font-size:10px;color:var(--gray)">' + esc(av.data) + '</div>';
    if (isA()) h += '<button style="background:none;font-size:12px;color:var(--red)" data-delaviso="' + ri + '">🗑️</button>';
    h += '</div>';
    h += '<div style="font-size:14px;font-weight:700;margin-top:4px">' + esc(av.titulo) + '</div>';
    h += '<div style="font-size:13px;color:#444;margin-top:4px;white-space:pre-wrap">' + esc(av.texto) + '</div></div>';
  });

  h += '</div>';
  el.innerHTML = h;
  setLogos();
}

// ============================================
// EVENT DELEGATION (todos os cliques)
// ============================================
document.addEventListener("click", function (ev) {
  var t = ev.target;
  var btn = t.closest ? t.closest("button") : null;
  var div = t.closest ? t.closest("div") : null;

  // ---------- Navegação ----------
  if (btn && btn.classList.contains("tb")) { go(btn.getAttribute("data-tab")); return; }
  if (btn && btn.getAttribute("data-go"))  { go(btn.getAttribute("data-go")); return; }

  // ---------- Modal ----------
  if ((btn && btn.id === "m-close") || t.id === "modal" || t.classList.contains("mo")) { closeM(); return; }

  // ---------- Logout / senha ----------
  if (btn && btn.id === "btn-logout") {
    mode = "";
    document.getElementById("app").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("ls").style.display = "none";
    return;
  }
  if (btn && btn.id === "btn-alterar-senha") {
    openM("Alterar Senha",
      '<div class="ig"><label>Senha atual</label><input id="f-senha-atual" type="password"></div>' +
      '<div class="ig"><label>Nova senha</label><input id="f-senha-nova" type="password"></div>' +
      '<div class="ig"><label>Confirmar nova senha</label><input id="f-senha-conf" type="password"></div>' +
      '<button class="bt" id="btn-save-senha" style="background:var(--green)">✅ Salvar</button>');
    return;
  }
  if (btn && btn.id === "btn-save-senha") {
    var atual = document.getElementById("f-senha-atual").value;
    var nova  = document.getElementById("f-senha-nova").value;
    var conf  = document.getElementById("f-senha-conf").value;
    var senhaCorreta = D.senhaAdmin || PASS_PADRAO;

    if (atual !== senhaCorreta)      { alert("Senha atual incorreta!"); return; }
    if (!nova || nova.length < 4)    { alert("A nova senha deve ter pelo menos 4 caracteres!"); return; }
    if (nova !== conf)               { alert("As senhas não conferem!"); return; }

    D.senhaAdmin = nova;
    sv();
    closeM();
    alert("✅ Senha alterada com sucesso!");
    return;
  }

  // ---------- Membros ----------
  if (btn && btn.id === "btn-add")  { openM("Novo Membro", mFormH()); return; }
  if (btn && btn.id === "btn-lote") {
    openM("Importar",
      '<p style="font-size:12px;color:#666;margin:0 0 10px">Nome, Apelido, Grupo</p>' +
      '<div class="ig"><textarea id="f-lote" rows="6" style="font-family:monospace" placeholder="Fernando, ~Fernando, A"></textarea></div>' +
      '<button class="bt" id="btn-do-lote" style="background:var(--blue)">📥 Importar</button>');
    return;
  }
  if (btn && btn.classList.contains("ch") && btn.getAttribute("data-filt")) {
    fM = btn.getAttribute("data-filt"); rMembros(); return;
  }
  if (btn && btn.getAttribute("data-edit")) { openM("Editar", mFormH(parseInt(btn.getAttribute("data-edit")))); return; }
  if (btn && btn.getAttribute("data-del")) {
    if (confirm("Desativar?")) {
      var m = D.membros.find(function (x) { return x.id === parseInt(btn.getAttribute("data-del")); });
      if (m) { m.ativo = false; sv(); renderAll(); }
    }
    return;
  }
  if (btn && btn.getAttribute("data-grp") && document.getElementById("f-gr")) {
    var g = btn.getAttribute("data-grp");
    document.getElementById("f-gr").value = g;
    btn.parentElement.querySelectorAll("button").forEach(function (b) {
      var bg = b.getAttribute("data-grp");
      b.style.background = bg === g ? GC[bg] : "var(--lg)";
      b.style.color = bg === g ? "#fff" : "#666";
    });
    return;
  }
  if (btn && btn.id === "btn-save-m")   { saveM(); return; }
  if (btn && btn.id === "btn-do-lote")  { doLote(); return; }

  // ---------- Tarefas ----------
  if (btn && btn.id === "btn-add-tarefa") { tFormOpen(); return; }
  if (btn && btn.hasAttribute("data-edit-tarefa")) { tFormOpen(parseInt(btn.getAttribute("data-edit-tarefa"))); return; }
  if (btn && btn.hasAttribute("data-del-tarefa")) {
    if (confirm("Remover?")) {
      D.tarefas.splice(parseInt(btn.getAttribute("data-del-tarefa")), 1);
      sv(); renderAll();
    }
    return;
  }
  if (btn && btn.id === "btn-save-tarefa") { saveT(); return; }

  // ---------- Escala: tipo / filtros ----------
  if (btn && btn.getAttribute("data-esc-tipo")) { eS.tipo = btn.getAttribute("data-esc-tipo"); rEscala(); return; }
  if (btn && btn.getAttribute("data-ftipo"))    { fTipo = btn.getAttribute("data-ftipo"); rTarefas(); return; }

  // ---------- Tipos de escala ----------
  if (btn && btn.id === "btn-add-tipo") {
    openM("Novo Tipo de Escala",
      '<div class="ig"><label>Nome do tipo</label><input id="f-novo-tipo" placeholder="Ex: Festa de Ogum"></div>' +
      '<button class="bt" id="btn-save-tipo" style="background:var(--purple)">✅ Criar</button>');
    return;
  }
  if (btn && btn.id === "btn-save-tipo") {
    var v = document.getElementById("f-novo-tipo").value.trim();
    if (!v) { alert("Digite o nome!"); return; }
    if (D.tiposEscala.indexOf(v) >= 0) { alert("Esse tipo já existe!"); return; }
    D.tiposEscala.push(v);
    fTipo = v;
    sv(); closeM(); renderAll();
    return;
  }
  if (btn && btn.getAttribute("data-del-tipo")) {
    var tp = btn.getAttribute("data-del-tipo");
    if (confirm("Remover o tipo " + tp + "? As tarefas desse tipo também serão removidas.")) {
      D.tiposEscala = D.tiposEscala.filter(function (x) { return x !== tp; });
      D.tarefas = D.tarefas.filter(function (t) { return t.tipo !== tp; });
      if (fTipo === tp) fTipo = D.tiposEscala[0] || "Gira";
      sv(); renderAll();
    }
    return;
  }
  if (btn && btn.id === "btn-copiar-gira") {
    var tg = D.tarefas.filter(function (t) { return t.tipo === "Gira"; });
    var h2 = '<p style="font-size:12px;color:#666;margin:0 0 10px">Marque as tarefas da Gira que quer copiar para <b>' + esc(fTipo) + '</b>:</p>';
    h2 += '<div style="max-height:300px;overflow:auto">';
    tg.forEach(function (t) {
      var idx = D.tarefas.indexOf(t);
      h2 += '<div class="chk-row"><input type="checkbox" data-copy-tarefa="' + idx + '" checked>';
      h2 += '<div style="flex:1"><div style="font-size:13px;font-weight:600">' + esc(t.nome) + '</div>';
      h2 += '<div style="font-size:11px;color:var(--gray)">' + t.fase + ' • ' + t.qtd + 'p</div></div></div>';
    });
    h2 += '</div>';
    h2 += '<button class="bt" id="btn-confirmar-copia" style="background:var(--green);margin-top:12px">✅ Copiar selecionadas</button>';
    openM("Copiar da Gira", h2);
    return;
  }
  if (btn && btn.id === "btn-confirmar-copia") {
    var copiadas = 0;
    document.querySelectorAll("[data-copy-tarefa]").forEach(function (cb) {
      if (cb.checked) {
        var idx = parseInt(cb.getAttribute("data-copy-tarefa"));
        var orig = D.tarefas[idx];
        if (orig) {
          D.tarefas.push({ tipo: fTipo, fase: orig.fase, nome: orig.nome, qtd: orig.qtd, fixos: [] });
          copiadas++;
        }
      }
    });
    sv(); closeM(); renderAll();
    alert("✅ " + copiadas + " tarefas copiadas para " + fTipo + "!");
    return;
  }

  // ---------- Voluntariado toggle ----------
  if (btn && btn.id === "btn-toggle-vol") { eS.voluntariado = !eS.voluntariado; rEscala(); return; }

  // ---------- ETAPA 1 → ETAPA 2: ir pra seleção de filhos ----------
  if (btn && btn.id === "btn-ir-filhos") {
    var dt = document.getElementById("e-data");
    if (!dt || !dt.value.trim()) { alert("Preencha a data!"); return; }
    eS.dataGira = dt.value.trim();
    eS.etapa = "filhos";
    if (!eS.selFilhos) eS.selFilhos = [];
    rEscala();
    return;
  }

  // ---------- ETAPA 2: tocar no card abre modal de escolha de fase ----------
  if (btn && btn.getAttribute("data-escolher-fase")) {
    var fid = parseInt(btn.getAttribute("data-escolher-fase"));
    var membro = D.membros.find(function (x) { return x.id === fid; });
    if (!membro) return;

    var faseAtual = eS.fasesFilhos[fid];

    var hv = '<div style="font-size:13px;color:#555;margin-bottom:14px;text-align:center">';
    hv +=   '<b>' + esc(membro.nome) + '</b><br>';
    hv +=   '<span style="font-size:11px;color:var(--gray)">Em qual fase esse filho vai trabalhar?</span>';
    hv += '</div>';

    hv += '<div class="fx fc gp8">';
    hv +=   '<button class="bt" data-set-fase="' + fid + '|PRÉ" ';
    hv +=     'style="background:var(--orange);' + (faseAtual === "PRÉ" ? "box-shadow:0 0 0 3px #fff,0 0 0 5px var(--orange)" : "") + '">';
    hv +=     '<span class="bi">🔸</span> PRÉ (antes da gira)';
    hv +=   '</button>';

    hv +=   '<button class="bt" data-set-fase="' + fid + '|PÓS" ';
    hv +=     'style="background:var(--green);' + (faseAtual === "PÓS" ? "box-shadow:0 0 0 3px #fff,0 0 0 5px var(--green)" : "") + '">';
    hv +=     '<span class="bi">🔸</span> PÓS (depois da gira)';
    hv +=   '</button>';

    hv +=   '<button class="bt" data-set-fase="' + fid + '|AMBOS" ';
    hv +=     'style="background:var(--blue);' + (faseAtual === "AMBOS" ? "box-shadow:0 0 0 3px #fff,0 0 0 5px var(--blue)" : "") + '">';
    hv +=     '<span class="bi">★</span> AMBOS (PRÉ e PÓS)';
    hv +=   '</button>';

    if (faseAtual) {
      hv += '<button class="bt" data-set-fase="' + fid + '|REMOVER" style="background:var(--red);margin-top:8px">';
      hv +=   '<span class="bi">✗</span> Remover da escala';
      hv += '</button>';
    }
    hv += '</div>';

    openM("Escolher fase", hv);
    return;
  }

  // Definir a fase escolhida no modal
  if (btn && btn.getAttribute("data-set-fase")) {
    var partes = btn.getAttribute("data-set-fase").split("|");
    var fid = parseInt(partes[0]);
    var fase = partes[1];

    if (fase === "REMOVER") {
      delete eS.fasesFilhos[fid];
      eS.selFilhos = eS.selFilhos.filter(function (x) { return x !== fid; });
    } else {
      eS.fasesFilhos[fid] = fase;
      if (eS.selFilhos.indexOf(fid) < 0) eS.selFilhos.push(fid);
    }

    closeM();
    rEscala();
    return;
  }

  // ---------- ETAPA 2: atalhos de seleção em massa ----------
  if (btn && btn.getAttribute("data-marcar")) {
    var modo = btn.getAttribute("data-marcar");

    if (modo === "nenhum") {
      eS.selFilhos = [];
      eS.fasesFilhos = {};
    } else {
      // PRÉ, PÓS ou AMBOS — aplica em todos os ativos
      eS.selFilhos = atv().map(function (m) { return m.id; });
      eS.fasesFilhos = {};
      eS.selFilhos.forEach(function (id) { eS.fasesFilhos[id] = modo; });
    }

    rEscala();
    return;
  }

  // ---------- ETAPA 2 → ETAPA 3: ir pra seleção de tarefas ----------
  if (btn && btn.id === "btn-ir-tarefas") {
    if (eS.selFilhos.length < 1) { alert("Toque nos filhos pra escolher PRÉ, PÓS ou AMBOS!"); return; }
    // Pré-marca todas as tarefas do tipo (excluindo DURANTE se for voluntariado)
    var all = [];
    D.tarefas.forEach(function (t, i) {
      if (t.tipo === eS.tipo && !(eS.voluntariado && t.fase === "DURANTE")) all.push(i);
    });
    eS.sel = all;
    eS.etapa = "selecionar";
    rEscala();
    return;
  }

  // ---------- Botões de voltar ----------
  if (btn && btn.id === "btn-volt-inicio") { eS.etapa = "inicio"; rEscala(); return; }
  if (btn && btn.id === "btn-volt-filhos") { eS.etapa = "filhos"; rEscala(); return; }

  // ---------- ETAPA 3 → ETAPA 4: GERAR PREVIEW ----------
  if (btn && btn.id === "btn-gerar-esc") {
    if (!eS.sel || !eS.sel.length) { alert("Selecione pelo menos uma tarefa!"); return; }
    var st = eS.sel.map(function (i) { return D.tarefas[i]; });
    var esc2 = gerarEsc(st, eS.selFilhos, eS.fasesFilhos);

    eS.etapa = "preview";
    eS.gira = {
      id: D.nGid,
      data: eS.dataGira,
      tipo: eS.tipo,
      status: "rascunho",
      escala: esc2,
      presenca: {},
      filhosSelecionados: eS.selFilhos.slice(),
      fasesFilhos: JSON.parse(JSON.stringify(eS.fasesFilhos))
    };
    eS.esc = esc2;
    rEscala();
    return;
  }

  // ---------- Cancelar ----------
  if (btn && (btn.id === "btn-canc-sel" || btn.id === "btn-canc")) {
    eS = { etapa: "inicio", gira: null, esc: null, sel: null, selFilhos: [], fasesFilhos: {}, tipo: eS.tipo || "Gira", voluntariado: false };
    rEscala();
    return;
  }

  // ---------- Regerar ----------
  if (btn && btn.id === "btn-regen") {
    var st = eS.sel.map(function (i) { return D.tarefas[i]; });
    eS.esc = gerarEsc(st, eS.selFilhos, eS.fasesFilhos);
    eS.gira.escala = eS.esc;
    rEscala();
    return;
  }

  // ---------- Publicar ----------
  if (btn && btn.id === "btn-pub") {
    var gi = JSON.parse(JSON.stringify(eS.gira));
    gi.status = "publicada";
    gi.voluntariado = eS.voluntariado || false;
    gi.voluntarios = [];

    if (gi.voluntariado) {
      gi.escala.forEach(function (item) {
        if (item.fase !== "DURANTE") item.membros = [];
      });
    }

    D.giras.push(gi);
    D.nGid++;
    D.rot = (D.rot + 1) % 4;
    sv();

    eS = { etapa: "inicio", gira: null, esc: null, sel: null, selFilhos: [], fasesFilhos: {}, tipo: eS.tipo || "Gira", voluntariado: false };
    renderAll();
    alert("✅ Publicada!" + (gi.voluntariado ? "\n🔋 Voluntariado ativo! Aguardando inscrições dos filhos." : ""));
    return;
  }

  // ---------- Trocar membro no preview ----------
  if (btn && btn.getAttribute("data-troca")) {
    var p = btn.getAttribute("data-troca").split("-");
    trocaOpen(parseInt(p[0]), parseInt(p[1]));
    return;
  }
  if (btn && btn.getAttribute("data-pick")) {
    var mid = parseInt(btn.getAttribute("data-pick"));
    var ei = parseInt(btn.getAttribute("data-ei"));
    var mi = parseInt(btn.getAttribute("data-mi"));
    var m = D.membros.find(function (x) { return x.id === mid; });
    if (m) {
      eS.esc[ei].membros[mi] = JSON.parse(JSON.stringify(m));
      eS.gira.escala = eS.esc;
    }
    closeM(); rEscala();
    return;
  }

  // ---------- Ver escala (modo filho) ----------
  if (btn && btn.getAttribute("data-ver-escala")) {
    var gid = parseInt(btn.getAttribute("data-ver-escala"));
    var gi = D.giras.find(function (g) { return g.id === gid; });
    if (gi) {
      var tipo = gi.tipo || "Gira";
      var hv = '<div style="font-size:12px;color:var(--gray);margin-bottom:10px">📅 ' + esc(tipo) + ' — ' + esc(gi.data) + '</div>';
      var fa2 = "";
      gi.escala.forEach(function (item) {
        if (item.fase !== fa2) {
          fa2 = item.fase;
          hv += '<div class="fh" style="background:' + (FCOR[fa2] || "#888") + ';margin-bottom:6px">' + fa2 + '</div>';
        }
        hv += '<div class="cd" style="padding:8px 12px;margin-bottom:6px">' +
              '<div style="font-size:12px;font-weight:700;color:#444;margin-bottom:4px">' + esc(item.tarefa) + '</div>' +
              '<div class="fx fw gp4">';
        item.membros.forEach(function (m) {
          hv += '<span class="mc2">' + gb(m.grupo) + ' ' + (m.apelido ? "@" + esc(m.apelido) : esc(m.nome)) + '</span>';
        });
        hv += '</div></div>';
      });
      openM("📅 Escala " + esc(gi.data), hv);
    }
    return;
  }

  // ---------- Voluntariado: inscrição (filho) ----------
  if (btn && btn.getAttribute("data-inscr")) {
    var gid = parseInt(btn.getAttribute("data-inscr"));
    window._volGid = gid;
    var gi = D.giras.find(function (g) { return g.id === gid; });
    if (gi) {
      var hv = '<div style="font-size:13px;color:#555;margin-bottom:14px">Informe seus dados para se voluntariar na <b>' +
                esc(gi.tipo || "Gira") + '</b> de <b>' + esc(gi.data) + '</b>.</div>';
      hv += '<div class="ig"><label>Seu nome</label><input id="f-vol-nome" placeholder="Como você é conhecido"></div>';
      hv += '<div class="ig"><label>Celular (WhatsApp)</label><input id="f-vol-cel" type="tel" placeholder="(21) 99999-9999"></div>';
      hv += '<div style="font-size:12px;font-weight:700;color:#444;margin:4px 0 10px">Disponível para:</div>';
      hv += '<div class="fx gp8">';
      hv +=   '<button class="bt" data-vol-disp="PRÉ" style="flex:1;padding:14px 8px;background:var(--orange);font-size:13px">🔸 PRÉ</button>';
      hv +=   '<button class="bt" data-vol-disp="PÓS" style="flex:1;padding:14px 8px;background:var(--green);font-size:13px">🔸 PÓS</button>';
      hv +=   '<button class="bt" data-vol-disp="PRÉ e PÓS" style="flex:1;padding:14px 8px;background:var(--blue);font-size:13px">★ Ambos</button>';
      hv += '</div>';
      openM("✋ Me Voluntariar", hv);
    }
    return;
  }
  if (btn && btn.getAttribute("data-vol-disp")) {
    var disp = btn.getAttribute("data-vol-disp");
    var nome = document.getElementById("f-vol-nome");
    var cel  = document.getElementById("f-vol-cel");
    if (!nome || !nome.value.trim()) { alert("Digite seu nome!"); return; }
    if (!cel  || !cel.value.trim())  { alert("Digite seu celular!"); return; }

    var gi = D.giras.find(function (g) { return g.id === window._volGid; });
    if (gi) {
      if (!gi.voluntarios || !Array.isArray(gi.voluntarios)) gi.voluntarios = [];
      gi.voluntarios.push({ nome: nome.value.trim(), cel: cel.value.trim(), disp: disp });
      sv(); closeM(); renderAll();
      alert("✅ Inscrito com sucesso!\nVocê se voluntariou para: " + disp);
    }
    return;
  }

  // ---------- Voluntariado: ver lista (admin) ----------
  if (btn && btn.getAttribute("data-ver-vol")) {
    var gid = parseInt(btn.getAttribute("data-ver-vol"));
    var gi = D.giras.find(function (g) { return g.id === gid; });
    if (gi) {
      var vol = gi.voluntarios || [];
      var pre = vol.filter(function (v) { return v.disp === "PRÉ" || v.disp === "PRÉ e PÓS"; });
      var pos = vol.filter(function (v) { return v.disp === "PÓS" || v.disp === "PRÉ e PÓS"; });

      var hv = '<div style="font-size:12px;color:#666;margin-bottom:10px">' + vol.length + ' voluntário(s) para <b>' + esc(gi.data) + '</b></div>';

      hv += '<div class="fh" style="background:var(--orange)">PRÉ (' + pre.length + ')</div>';
      if (!pre.length) hv += '<div style="color:#aaa;font-size:12px;padding:6px 0">Nenhum ainda</div>';
      pre.forEach(function (v) {
        hv += '<div style="font-size:13px;padding:5px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between">' +
              '<span>' + esc(v.nome) + '</span><span style="color:var(--gray);font-size:11px">' + esc(v.cel) + '</span></div>';
      });

      hv += '<div class="fh" style="background:var(--green);margin-top:8px">PÓS (' + pos.length + ')</div>';
      if (!pos.length) hv += '<div style="color:#aaa;font-size:12px;padding:6px 0">Nenhum ainda</div>';
      pos.forEach(function (v) {
        hv += '<div style="font-size:13px;padding:5px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between">' +
              '<span>' + esc(v.nome) + '</span><span style="color:var(--gray);font-size:11px">' + esc(v.cel) + '</span></div>';
      });

      if (vol.length > 0) {
        hv += '<button id="btn-sortear-vol" data-gid="' + gi.id + '" class="bt" style="background:var(--purple);margin-top:14px">⚡ Sortear com Voluntários</button>';
      } else {
        hv += '<div style="margin-top:12px;padding:10px;background:#fff9e6;border-radius:10px;font-size:12px;color:#8a6d00;text-align:center">⚠️ Aguardando inscrições dos filhos</div>';
      }

      openM("👥 Voluntários — " + esc(gi.data), hv);
    }
    return;
  }
  if (btn && btn.id === "btn-sortear-vol") {
    var gid = parseInt(btn.getAttribute("data-gid"));
    var gi = D.giras.find(function (g) { return g.id === gid; });
    if (!gi) return;

    var vol = gi.voluntarios || [];
    if (!vol.length) { alert("Nenhum voluntário ainda!"); return; }

    var tipo = gi.tipo || "Gira";
    var tarefasTipo = D.tarefas.filter(function (t) { return t.tipo === tipo && t.fase !== "DURANTE"; });
    if (!tarefasTipo.length) { alert("Nenhuma tarefa de PRÉ/PÓS cadastrada!"); return; }

    var poolPre = shuf(vol.filter(function (v) { return v.disp === "PRÉ" || v.disp === "PRÉ e PÓS"; }));
    var poolPos = shuf(vol.filter(function (v) { return v.disp === "PÓS" || v.disp === "PRÉ e PÓS"; }));

    var novaEscala = [];
    tarefasTipo.forEach(function (t) {
      var pool = t.fase === "PRÉ" ? poolPre : poolPos;
      var membros = [];
      for (var i = 0; i < t.qtd; i++) {
        if (pool.length) {
          membros.push({ nome: pool[i % pool.length].nome, cel: pool[i % pool.length].cel, grupo: "A", id: null });
        }
      }
      novaEscala.push({ fase: t.fase, tarefa: t.nome, qtd: t.qtd, membros: membros });
    });

    gi.escala = novaEscala;
    gi.sorteadoVol = true;
    sv(); closeM(); renderAll();
    alert("✅ Escala sorteada com os voluntários!");
    return;
  }

  // ---------- WhatsApp ----------
  if (btn && btn.getAttribute("data-wpp")) {
    var gi = D.giras.find(function (g) { return g.id === parseInt(btn.getAttribute("data-wpp")); });
    if (gi) {
      openM("📱 WhatsApp",
        '<pre class="wp">' + esc(wppMsg(gi)) + '</pre>' +
        '<button class="bt" id="btn-copy" data-gid="' + gi.id + '" style="background:var(--wpp);margin-top:10px">📋 Copiar</button>');
    }
    return;
  }
  if (btn && btn.id === "btn-copy") {
    var gid = parseInt(btn.getAttribute("data-gid"));
    var gi = D.giras.find(function (g) { return g.id === gid; });
    if (gi) {
      navigator.clipboard.writeText(wppMsg(gi)).then(function () {
        btn.textContent = "✅ Copiado!";
        setTimeout(function () { btn.textContent = "📋 Copiar"; }, 2000);
      });
    }
    return;
  }

  // ---------- Ir pra presença / apagar gira ----------
  if (btn && btn.getAttribute("data-gopres")) { pGid = parseInt(btn.getAttribute("data-gopres")); go("presenca"); return; }
  if (btn && btn.getAttribute("data-delgira")) {
    if (confirm("Tem certeza que deseja apagar esta gira? Essa ação não pode ser desfeita.")) {
      var gid = parseInt(btn.getAttribute("data-delgira"));
      D.giras = D.giras.filter(function (g) { return g.id !== gid; });
      sv(); renderAll();
    }
    return;
  }

  // ---------- Presença ----------
  if (div && div.getAttribute("data-pgira")) { pGid = parseInt(div.getAttribute("data-pgira")); rPresenca(); return; }
  if (btn && btn.id === "btn-pvolt") { pGid = null; rPresenca(); return; }
  if (btn && btn.getAttribute("data-pmark")) {
    var p = btn.getAttribute("data-pmark").split("-");
    var gi = D.giras.find(function (g) { return g.id === pGid; });
    if (gi) {
      if (!gi.presenca) gi.presenca = {};
      gi.presenca[parseInt(p[0])] = p[1];
      sv(); rPresenca();
    }
    return;
  }

  // ---------- Mensalidade ----------
  if (btn && btn.getAttribute("data-mens")) {
    var p = btn.getAttribute("data-mens").split("-");
    D.mensalidades[mesAno() + "_" + parseInt(p[0])] = p[1];
    sv(); rMensalidade();
    return;
  }
  if (btn && btn.id === "btn-edit-valor") {
    openM("Valor da Mensalidade",
      '<div class="ig"><label>Valor (R$)</label><input id="f-valor" type="number" step="0.01" min="0" value="' +
        (D.valorMensalidade || "") + '" placeholder="Ex: 100"></div>' +
      '<button class="bt" id="btn-save-valor" style="background:var(--green)">✅ Salvar</button>');
    return;
  }
  if (btn && btn.id === "btn-save-valor") {
    var v = parseFloat(document.getElementById("f-valor").value);
    if (!isNaN(v) && v >= 0) {
      D.valorMensalidade = v;
      sv(); closeM(); renderAll();
    } else {
      alert("Digite um valor!");
    }
    return;
  }

  // ---------- Doações ----------
  if (btn && btn.id === "btn-add-item") {
    openM("Novo Item",
      '<div class="ig"><label>Item</label><input id="f-item"></div>' +
      '<button class="bt" id="btn-save-item" style="background:var(--green)">✅ Adicionar</button>');
    return;
  }
  if (btn && btn.id === "btn-save-item") {
    var v = document.getElementById("f-item").value.trim();
    if (v) { D.itensDoacao.push(v); sv(); closeM(); renderAll(); }
    return;
  }
  if (btn && btn.hasAttribute("data-delitem")) {
    D.itensDoacao.splice(parseInt(btn.getAttribute("data-delitem")), 1);
    sv(); renderAll();
    return;
  }
  if (btn && btn.id === "btn-sortear") {
    if (confirm("Sortear?")) {
      var a = shuf(atv());
      var it = D.itensDoacao;
      var ma = mesAno();
      var r = [];
      for (var i = 0; i < a.length; i++) {
        r.push({ id: a[i].id, nome: a[i].nome, grupo: a[i].grupo, apelido: a[i].apelido, item: it[i % it.length] });
      }
      D.sorteios[ma] = r;
      sv(); renderAll();
      alert("✅ Sorteado!");
    }
    return;
  }
  if (btn && btn.id === "btn-wpp-doacao") {
    var ma = mesAno();
    var s = D.sorteios[ma];
    if (s) {
      var m = "🎁 *Doações " + ma + "*\n\n";
      s.forEach(function (x) { m += "• " + (x.apelido ? "@" + x.apelido : x.nome) + " → *" + x.item + "*\n"; });
      navigator.clipboard.writeText(m).then(function () { alert("✅ Copiado!"); });
    }
    return;
  }

  // ---------- Calendário ----------
  if (btn && btn.id === "btn-add-cal") {
    openM("Evento",
      '<div class="ig"><label>Título</label><input id="f-cal-tit"></div>' +
      '<div class="ig"><label>Data</label><input id="f-cal-data"></div>' +
      '<div class="ig"><label>Desc</label><input id="f-cal-desc"></div>' +
      '<button class="bt" id="btn-save-cal" style="background:var(--blue)">✅ Salvar</button>');
    return;
  }
  if (btn && btn.id === "btn-save-cal") {
    var tit = document.getElementById("f-cal-tit").value.trim();
    var dt = document.getElementById("f-cal-data").value.trim();
    if (tit && dt) {
      D.calendario.push({ titulo: tit, data: dt, desc: document.getElementById("f-cal-desc").value.trim() });
      sv(); closeM(); renderAll();
    }
    return;
  }
  if (btn && btn.hasAttribute("data-delcal")) {
    D.calendario.splice(parseInt(btn.getAttribute("data-delcal")), 1);
    sv(); renderAll();
    return;
  }

  // ---------- Avisos ----------
  if (btn && btn.id === "btn-add-aviso") {
    openM("Aviso",
      '<div class="ig"><label>Título</label><input id="f-av-tit"></div>' +
      '<div class="ig"><label>Mensagem</label><textarea id="f-av-txt" rows="4"></textarea></div>' +
      '<button class="bt" id="btn-save-aviso" style="background:var(--orange)">📢 Publicar</button>');
    return;
  }
  if (btn && btn.id === "btn-save-aviso") {
    var tit = document.getElementById("f-av-tit").value.trim();
    var txt = document.getElementById("f-av-txt").value.trim();
    if (tit && txt) {
      D.avisos.push({ titulo: tit, texto: txt, data: new Date().toLocaleDateString("pt-BR") });
      sv(); closeM(); renderAll();
    }
    return;
  }
  if (btn && btn.hasAttribute("data-delaviso")) {
    D.avisos.splice(parseInt(btn.getAttribute("data-delaviso")), 1);
    sv(); renderAll();
    return;
  }
});


// ============================================
// EVENTOS DE CHANGE (checkboxes)
// ============================================
document.addEventListener("change", function (ev) {
  var t = ev.target;

  if (t.id === "file-import") {
    var f = t.files[0];
    if (f) {
      var r = new FileReader();
      r.onload = function (e) {
        try {
          var d = JSON.parse(e.target.result);
          if (d.membros) { D = d; sv(); renderAll(); alert("✅ OK"); }
        } catch (ex) {
          alert("❌ Erro");
        }
      };
      r.readAsText(f);
    }
    t.value = "";
    return;
  }

  if (t.hasAttribute("data-sel-tarefa")) {
    var idx = parseInt(t.getAttribute("data-sel-tarefa"));
    if (t.checked) {
      if (eS.sel.indexOf(idx) < 0) eS.sel.push(idx);
    } else {
      eS.sel = eS.sel.filter(function (x) { return x !== idx; });
    }
    return;
  }
});


// ============================================
// FORMULÁRIOS — Helpers
// ============================================
function mFormH(eid) {
  var m = eid ? D.membros.find(function (x) { return x.id === eid; }) : null;
  var nm = m ? esc(m.nome) : "";
  var ap = m ? esc(m.apelido || "") : "";
  var gr = m ? m.grupo : "A";

  var h = '<div class="ig"><label>Nome</label><input id="f-nm" value="' + nm + '"></div>';
  h += '<div class="ig"><label>Apelido</label><input id="f-ap" value="' + ap + '"></div>';
  h += '<div class="ig"><label>Grupo</label><div class="fx gp6">';

  GR.forEach(function (g) {
    h += '<button data-grp="' + g + '" style="flex:1;padding:10px;border-radius:10px;background:' +
          (gr === g ? GC[g] : "var(--lg)") + ';color:' + (gr === g ? "#fff" : "#666") +
          ';font-weight:800;font-size:16px">' + g + '</button>';
  });

  h += '</div></div>';
  h += '<input type="hidden" id="f-gr" value="' + gr + '">';
  h += '<input type="hidden" id="f-eid" value="' + (eid || "") + '">';
  h += '<button class="bt" id="btn-save-m" style="background:var(--dk3)">✅ ' + (m ? "Salvar" : "Cadastrar") + '</button>';
  return h;
}

function saveM() {
  var nm = document.getElementById("f-nm").value.trim();
  if (!nm) return alert("Nome!");

  var ap = document.getElementById("f-ap").value.trim() || null;
  var gr = document.getElementById("f-gr").value;
  var eid = document.getElementById("f-eid").value;

  if (eid) {
    var m = D.membros.find(function (x) { return x.id === parseInt(eid); });
    if (m) { m.nome = nm; m.apelido = ap; m.grupo = gr; }
  } else {
    D.membros.push({ id: D.nMid++, nome: nm, apelido: ap, grupo: gr, ativo: true });
  }

  sv(); closeM(); renderAll();
}

function doLote() {
  var txt = document.getElementById("f-lote").value.trim();
  if (!txt) return;

  var ok = 0;
  txt.split("\n").forEach(function (l) {
    var p = l.split(",").map(function (x) { return x.trim(); });
    if (p.length >= 2) {
      var nm = p[0];
      var ap = p[1] || null;
      var gr = (p[2] || "A").toUpperCase();
      if (GR.indexOf(gr) >= 0 && nm) {
        D.membros.push({ id: D.nMid++, nome: nm, apelido: ap, grupo: gr, ativo: true });
        ok++;
      }
    }
  });

  sv(); closeM(); renderAll();
  alert("✅ " + ok + " importados!");
}

function tFormOpen(idx) {
  var t = idx !== undefined ? D.tarefas[idx] : null;
  var nome = t ? esc(t.nome) : "";
  var qtd  = t ? t.qtd : 1;
  var fase = t ? t.fase : "";
  var fixos = t ? t.fixos : [];
  var tipo = t ? t.tipo : fTipo;

  if (!fase) fase = FASES_PADRAO[0];

  var h = '<div class="ig"><label>Tipo de escala</label><select id="f-tipo">';
  D.tiposEscala.forEach(function (tp) {
    h += '<option value="' + esc(tp) + '"' + (tipo === tp ? " selected" : "") + '>' + esc(tp) + '</option>';
  });
  h += '</select></div>';

  h += '<div class="ig"><label>Fase</label><select id="f-fase">';
  FASES_PADRAO.forEach(function (f) {
    h += '<option value="' + f + '"' + (fase === f ? " selected" : "") + '>' + f + '</option>';
  });
  h += '</select></div>';

  h += '<div class="ig"><label>Tarefa</label><input id="f-tnome" value="' + nome + '"></div>';
  h += '<div class="ig"><label>Qtd pessoas</label><input id="f-tqtd" type="number" min="1" value="' + qtd + '"></div>';

  h += '<div class="ig"><label>Pessoas fixas</label>';
  h += '<div style="max-height:150px;overflow:auto;border:1px solid #e8e8e8;border-radius:10px;padding:6px">';
  atv().forEach(function (m) {
    var ck = fixos.indexOf(m.id) >= 0;
    h += '<div class="chk-row"><input type="checkbox" data-fixo-id="' + m.id + '"' + (ck ? " checked" : "") + '>';
    h +=   gb(m.grupo) + ' <span style="font-size:13px">' + esc(m.nome) + '</span></div>';
  });
  h += '</div></div>';

  h += '<input type="hidden" id="f-tidx" value="' + (idx !== undefined ? idx : "") + '">';
  h += '<button class="bt" id="btn-save-tarefa" style="background:var(--dk3)">✅ ' + (t ? "Salvar" : "Cadastrar") + '</button>';

  openM(t ? "Editar Tarefa" : "Nova Tarefa", h);
}

function saveT() {
  var tipo = document.getElementById("f-tipo").value;
  var fase = document.getElementById("f-fase").value;
  var nome = document.getElementById("f-tnome").value.trim();
  var qtd = parseInt(document.getElementById("f-tqtd").value) || 1;
  var idx = document.getElementById("f-tidx").value;

  if (!nome) return alert("Nome!");

  var fixos = [];
  document.querySelectorAll("[data-fixo-id]").forEach(function (cb) {
    if (cb.checked) fixos.push(parseInt(cb.getAttribute("data-fixo-id")));
  });

  if (idx !== "") {
    var t = D.tarefas[parseInt(idx)];
    t.tipo = tipo; t.fase = fase; t.nome = nome; t.qtd = qtd; t.fixos = fixos;
  } else {
    D.tarefas.push({ tipo: tipo, fase: fase, nome: nome, qtd: qtd, fixos: fixos });
  }

  sv(); closeM(); renderAll();
}

function trocaOpen(ei, mi) {
  var a = atv();
  var at = eS.esc[ei].membros[mi];

  var h = '<p style="font-size:12px;color:#666;margin:0 0 10px">Substituindo: <b>' + esc(at.nome) + '</b></p>';
  h += '<div style="max-height:250px;overflow:auto;display:flex;flex-direction:column;gap:4px">';

  a.forEach(function (m) {
    h += '<button data-pick="' + m.id + '" data-ei="' + ei + '" data-mi="' + mi +
          '" style="padding:8px 12px;border-radius:10px;border:1px solid #eee;background:' +
          (m.id === at.id ? "#e8f5e9" : "#fff") +
          ';display:flex;align-items:center;gap:6px;text-align:left;width:100%">';
    h +=   gb(m.grupo) + '<span style="font-size:13px">' + esc(m.nome) + '</span>';
    h += '</button>';
  });

  h += '</div>';
  openM("Trocar", h);
}
</script>
